<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./wikiedia.css">
</head>
<body>

    <section class="hero">
        <div class="title">
            <h1>WIKIPEDIA</h1>
            <p>The Free Encyclopedia</p>
        </div>

        <div class="ass">





            <div class="languages">
    
                <div class="left-langs">
                    <div class="lang1">
                        <h3>English</h3>
                        <p>7,189,000+ articles</p>
                    </div>
    
                    <div class="lang2">
                        <h3>Deutsch</h3>
                        <p>3,125,000+ Artikel</p>
                    </div>
    
                    <div class="lang3">
                        <h3>Français</h3>
                        <p>2,761,000+ articles</p>
                    </div>
                </div>
    
                <div class="globe">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/de/Wikipedia_Logo_1.0.png" alt="">
                </div>
    
                <div class="right-langs">
                    <div class="lang4">
                        <h3>日本語</h3>
                        <p>1,503,000+ 記事</p>
                    </div>
    
                    <div class="lang5">
                        <h3>Русский</h3>
                        <p>2,103,000+ статей</p>
                    </div>
    
                    <div class="lang6">
                        <h3>Español</h3>
                        <p>2,116,000+ artículos</p>
                    </div>
                </div>
    
            </div>



        </div>    

        
      </section>
      <div class="search-box">

          <input type="text" placeholder="Search Wikipedia">

          <select>
              <option>EN</option>
          </select>

          <button>🔍</button>

      </div>

      <button class="language-btn">
          Read Wikipedia in your language
      </button>

</body>
</body>
</html>
